  - {name: 🎵 TikTok, type: select, proxies: [🔯 JP FB, 🔯 SG FB, 🔯 US FB, 🇨🇳 TW,♻️ HK auto, ♻️ JP auto, ♻️ SG auto, ♻️ US auto, ♻️ Auto, 🇭🇰 HK, 🇯🇵 JP, 🇸🇬 SG, 🇺🇲 US, 🌐 All, Direct]}
